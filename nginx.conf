# nginx.conf
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA History API fallback: serve index.html for non-file routes
  location / {
    try_files $uri /index.html;
  }

  # Optional: cache static assets generated by Vite (adjust path if needed)
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Optional: avoid caching index.html (ensure latest app)
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}